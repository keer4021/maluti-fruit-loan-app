<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Employees - Maluti Fruit Loan App</title>
  <link rel="stylesheet" href="../css/app.css">
</head>
<body data-page="employees">
<div id="appShell"></div>
<main>
  <section id="employees" class="page"><div class="employee-layout">
    <div class="card"><h2 id="employeeFormTitle">New Employee</h2><form id="employeeForm"><input id="editEmployeeId" type="hidden"><label>Employee Number *</label><input id="newEmpNo" required placeholder="e.g. 202001"><label>Full Name and Surname *</label><input id="newEmpName" required><label>ID or Passport Number</label><input id="newEmpId" autocomplete="off"><label>Department / Position</label><input id="newEmpDepartment"><div class="actions"><button class="primary" type="submit">Save Employee</button><button class="btn" type="button" id="resetEmployeeFields">Clear Fields</button><button class="btn hide" type="button" id="cancelEmployeeEdit">Cancel Edit</button></div></form></div>
    <div class="card"><h2>Existing Employees</h2><label>Search by name, employee number or ID</label><input id="employeeSearch" type="search" placeholder="Type to search..."><div class="actions"><button class="btn" id="exportEmployees">Export Masterfile CSV</button><button class="btn" id="clearEmployeeSearch">Clear Fields</button></div><div class="tablebox" style="margin-top:12px"><table class="employee-table"><thead><tr><th>Emp #</th><th>Name</th><th>ID / Passport</th><th>Status</th><th>Actions</th></tr></thead><tbody id="employeeRows"></tbody></table></div></div>
  </div></section>
</main>
<script src="../js/core.js"></script>
<script src="../js/employees.js"></script>
</body>
</html>
