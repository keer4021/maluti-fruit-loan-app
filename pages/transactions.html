<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Transactions - Maluti Fruit Loan App</title>
  <link rel="stylesheet" href="../css/app.css">
</head>
<body data-page="transactions">
<div id="appShell"></div>
<main>
  <section id="transactions" class="page">
    <div class="card"><h2>Employee Loan History</h2>
      <div class="grid"><div><label>Select Employee</label><select id="transactionEmployee"><option value="">All Employees</option></select></div><div><label>Search</label><input id="transactionSearch" type="search" placeholder="Name, emp # or ID"></div><div><label>Date From</label><input id="transactionFrom" type="date"></div><div><label>Date To</label><input id="transactionTo" type="date"></div></div>
      <div style="min-width:210px"><label>Status Filter</label><select id="transactionStatusFilter"><option value="">All Statuses</option><option>New</option><option>Partial Paid</option><option>Fully Paid</option><option>Cancelled</option></select></div>
      <div class="actions"><button class="primary" type="button" id="runTransactionFilter">Load History</button><button class="btn" type="button" id="exportTransactions">Export Loan History CSV</button><button class="btn" type="button" id="clearTransactionFields">Clear Fields</button></div>
    </div>
    <div class="grid" style="margin-top:16px"><div class="card metric"><span class="muted">Number of Loans</span><b id="tLoanCount">0</b></div><div class="card metric"><span class="muted">Total Loans</span><b id="tLoanTotal">R 0,00</b></div><div class="card metric"><span class="muted">Total Paid</span><b id="tTotalPaid">R 0,00</b></div><div class="card metric"><span class="muted">Outstanding Balance</span><b id="tOutstandingTotal">R 0,00</b></div></div>
    <div class="card" style="margin-top:16px"><h3>Previous and Current Loans</h3><div class="tablebox"><table><thead><tr><th>Employee</th><th>Loan #</th><th>Application Date</th><th>Type / Reason</th><th>Amount</th><th>Monthly</th><th>Paid</th><th>Balance</th><th>First Deduction</th><th>Status / Action</th></tr></thead><tbody id="transactionLoanRows"></tbody></table></div></div>
  </section>
</main>
<script src="../js/core.js"></script>
<script src="../js/transactions.js"></script>
</body>
</html>
