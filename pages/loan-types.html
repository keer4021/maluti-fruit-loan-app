<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Loan Types - Maluti Fruit Loan App</title>
  <link rel="stylesheet" href="../css/app.css">
</head>
<body data-page="loan-types">
<div id="appShell"></div>
<main>
  <section id="loan-types" class="page"><div class="two">
    <div class="card"><h2 id="loanTypeFormTitle">Add Loan Type</h2><form id="loanTypeForm"><input id="editLoanTypeId" type="hidden"><label>Loan Type Name *</label><input id="newLoanType" required placeholder="e.g. Emergency Loan"><div class="actions"><button class="primary" type="submit" id="saveLoanTypeButton">Add Loan Type</button><button class="btn" type="button" id="clearLoanTypeFields">Clear Fields</button><button class="btn hide" type="button" id="cancelLoanTypeEdit">Cancel Edit</button></div></form></div>
    <div class="card"><h2>Existing Loan Types</h2><div class="tablebox"><table><thead><tr><th>Loan Type</th><th>Status</th><th>Action</th></tr></thead><tbody id="loanTypeRows"></tbody></table></div></div>
  </div></section>
</main>
<script src="../js/core.js"></script>
<script src="../js/loan-types.js"></script>
</body>
</html>
